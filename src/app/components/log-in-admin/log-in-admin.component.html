<app-header-main></app-header-main>

<div *ngIf="eror">
    <p-messages [value]="messagesEror" [enableService]="false" [closable]="false"></p-messages>
</div>

<div id="card">
    <div id="card-content">
      <div id="card-title">
        <h2>כניסת מנהלים</h2>
        <!-- <div class="underline-title"></div> -->
      </div>
      <form method="post" class="form" (ngSubmit)="logINAdmin()">
        <label for="idEmployee" style="padding-top:13px">
         מספר זהות
          </label>
        <input [(ngModel)]="tzAdmin"  id="idEmployee" class="form-content" type="text" name="text" autocomplete="on" required />
        <div class="form-border"></div>
        <label for="passWordAdmin" style="padding-top:22px">סיסמא
          </label>
        <input [(ngModel)]="passWord" id="passWordAdmin" class="form-content" type="password" name="password" required />
        <div class="form-border"></div>
       
        <input id="submit-btn" type="submit" name="submit" value="היכנס" />
        <!-- <button class="btnIn" (click)="logINAdmin()">היכנס</button> -->
    
      </form>
    </div>
  </div>
