<app-header-user></app-header-user>
<h2 class="text-center mt-3">מה תרצה להזמין לחדר שלך?</h2>

<div class="flex text-center py-2">
   <button class="btn btn-success mx-auto" *ngIf="moneProduct> 0" (click)="sendToCart()">לחץ לאישור הזמנה</button>
</div>
<div *ngIf="suucses">
   <p-messages [value]="messages" [enableService]="false" [closable]="false"></p-messages>
</div>
<div class="p-3 productsWrapper ">

   <!-- <p>{{priceForAll}}</p> -->
   <h5 class="mt-3 text-center">סך הכול: {{priceForAll| currency: 'ILS'}}</h5>

   <div class="col-12">
      <div class="productsGrid">
         <div *ngFor="let item of products" class="product card col-sm-5 col-lg-3    text-center m-3 p-3 ">
            <app-product (productEvent)="productFromChildToSave($event)" [product]="item"></app-product>
         </div>
      </div>
      <!-- <div  *ngIf="productFromChild" class="row">
      <div (click)="show()" class="col-12">
         {{productFromChild.nameProduct}}
      </div>
   </div> -->
   </div>
</div>
